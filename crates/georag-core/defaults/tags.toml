# Topic tags: the 34 v1 defaults with their folder and filename patterns.
# Patterns are matched case-insensitively against the folder path and the
# file name (separators replaced by spaces). Edit freely; `georag tags`
# keeps this file and the index in step.

[[tag]]
name = "piling"
display_name = "Piling"
color = "#e74c3c"
description = "Pile foundations, driven piles, bored piles, pile load tests"
patterns = ["pile", "piling", "bored pile", "driven pile", "cfa", "pile load", "pile cap", "micropile", "foundation", "bearing capacity", "settlement"]

[[tag]]
name = "diaphragm_wall"
