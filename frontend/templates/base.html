<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}geoRAG{% endblock %}</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/pico.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong><a href="/" class="nav-brand">
                <img src="/static/images/hetge.svg" alt="hetGE" class="nav-logo">
                <span>geoRAG</span>
            </a></strong></li>
        </ul>
        <ul>
            <li><a href="/" class="{% if active_page == 'chat' %}active{% endif %}">Chat</a></li>
            <li><a href="/documents" class="{% if active_page == 'documents' %}active{% endif %}">Documents</a></li>
        </ul>
    </nav>
    <main class="container-fluid">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/marked.min.js"></script>
    <script src="/static/js/utils.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
