[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.85"
publish = false
repository = "https://github.com/hetGE/georag-rs"

[workspace.dependencies]
georag-core = { path = "crates/georag-core" }
georag-engine = { path = "crates/georag-engine" }
georag-extract = { path = "crates/georag-extract" }
georag-store = { path = "crates/georag-store" }
georag-daemon = { path = "crates/georag-daemon" }
georag-tui = { path = "crates/georag-tui" }

# Versions verified on crates.io on 2026-10-20. Add a crate here when a phase
# starts using it; do not pin crates nothing depends on yet.
llama-cpp-2 = { version = "0.1.160", default-features = false }
llama-cpp-sys-2 = { version = "0.1.160", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
clap = { version = "4.6.7", features = ["derive", "env"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
unicode-width = "0.2.2"
tar = "0.4.46"
flate2 = "1.1.10"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlite-vec = "0.1.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "json", "system-proxy", "charset"] }
minisign-verify = "0.3.0"
semver = "1.0.28"
indicatif = "0.18.6"
self-replace = "1.5.0"
pdfium-render = "0.9.4"
calamine = "0.37.0"
csv = "1.3"
quick-xml = "0.42.0"
html2text = "0.17.4"
text-splitter = "0.33.1"
walkdir = "2.5.0"
blake3 = "1.8.7"
notify = "9.0.0-rc.6"
notify-debouncer-full = "0.8.0-rc.2"
rayon = "1.12.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# llama.cpp is compiled by cmake inside llama-cpp-sys-2; cmake-rs maps the
# package opt-level to the CMake build type, so without this a dev build gets a
# Debug llama.cpp and generation is unusably slow.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
